name: Style

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install --system ruff==0.14.10 ty==0.0.1a21

      - name: Run ruff linting
        run: ruff check --config=pyproject.toml . --extend-exclude tools/colab-income-pilot.ipynb --extend-exclude rlm/v100/chat_progress.py --extend-exclude rlm/v100/research_tools.py

      - name: Run ruff formatting check
        run: ruff format --diff --config=pyproject.toml --exclude tools/colab-income-pilot.ipynb --exclude rlm/v100/research_contract.py --exclude tests/test_v100_financial_chat_contract.py --exclude tests/test_v100_model_candidates.py .

      - name: Run ty type checking
        run: ty check --exit-zero --output-format=concise
