name: V100 controller CPU validation
on:
  pull_request:
    paths:
      - 'rlm/v100/**'
      - 'tests/test_v100*'
      - 'tools/*.ps1'
      - 'tools/managed-release.json'
      - 'tests/test_windows_release_integrity.py'
      - '.github/workflows/v100-cpu-validation.yml'
  push:
    branches: [v100-rtx-reconnect, v100-model-migration]
    paths:
      - 'rlm/v100/**'
      - 'tests/test_v100*'
      - 'tools/*.ps1'
      - 'tools/managed-release.json'
      - 'tests/test_windows_release_integrity.py'
      - '.github/workflows/v100-cpu-validation.yml'
permissions:
  contents: read
concurrency:
  group: v100-cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies and CPU Torch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install . pytest==8.4.2 numpy==2.2.6 psutil==7.0.0 safetensors==0.8.0 tomli-w==1.2.0 transformers==5.17.0 peft==0.21.2 accelerate==1.15.0 nltk==3.10.3
      - name: Exercise controller, DPO gradients, tensor breeding and tiny model training
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: python -m pytest -q tests/test_v100*.py tests/test_windows_release_integrity.py
  powershell-parser:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows scripts without executing helper or installers
        shell: powershell
        run: |
          $failures = 0
          Get-ChildItem -Path tools -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($problem in $errors) {
              Write-Output ($_.Name + ': ' + $problem.Message)
              $failures += 1
            }
          }
          if ($failures -gt 0) { throw 'PowerShell syntax errors detected.' }
      - name: Verify bounded helper maintenance admission
        shell: powershell
        run: ./tools/test-windows-maintenance.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture complete native traceback under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python.exe).Source
          $log = Join-Path $env:TEMP 'synta-native-error-test.log'
          $fixture = Join-Path $env:TEMP 'synta-native-error-test.py'
          "raise RuntimeError('synta-traceback-sentinel')" | Set-Content -Encoding ASCII $fixture
          $source = Get-Content -Raw tools/bootstrap-synta-windows.ps1
          $start = $source.IndexOf('$previousErrorPolicy =')
          $end = $source.IndexOf('if ($acquisitionExit -ne 0)')
          if ($start -lt 0 -or $end -le $start) { throw 'Native capture block missing.' }
          $block = $source.Substring($start, $end - $start)
          $block = [regex]::Replace($block, '(?m)^    & \$python -c .*$', '    & $python $fixture *>> $log')
          . ([scriptblock]::Create($block))
          if ($acquisitionExit -ne 1) { throw 'Failed child process exit was lost.' }
          if ($ErrorActionPreference -ne 'Stop') { throw 'Caller error policy was not restored.' }
          if ((Get-Content -Raw $log) -notmatch 'RuntimeError: synta-traceback-sentinel') { throw 'Complete traceback was not captured.' }
          # The intentionally failed child remains LASTEXITCODE=1. All assertions
          # above must pass before reporting success to the Actions shell wrapper.
          exit 0
      - name: Verify windowless task launcher preserves arguments and exit status
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE 'ai-v100-helper'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $fixture = Join-Path $root 'background-fixture.ps1'
          $marker = Join-Path $root 'background-fixture-result.txt'
          "'passed' | Set-Content -LiteralPath '$marker'; exit 23" | Set-Content -Encoding ASCII $fixture
          $global:syntaCapturedActions = @{}
          $cpuRoot = Join-Path $env:USERPROFILE 'ai-owned-compute'
          function Get-ScheduledTask { param($TaskName,$ErrorAction) if ($TaskName -eq 'Synta-Owned-CPU-Worker') { return [pscustomobject]@{Actions=@([pscustomobject]@{Execute=(Join-Path $PSHOME 'powershell.exe');Arguments=('-NoProfile -File "' + (Join-Path $cpuRoot 'autostart-watchdog.ps1') + '"')})} }; if ($TaskName -eq 'Synta-Managed-Update') { [pscustomobject]@{Actions=@([pscustomobject]@{Execute=(Join-Path $PSHOME 'powershell.exe');Arguments=('-NoProfile -File "' + $fixture + '"')})} } }
          function New-ScheduledTaskAction { param($Execute,$Argument) [pscustomobject]@{Execute=$Execute;Arguments=$Argument} }
          function Set-ScheduledTask { param($TaskName,$Action) $global:syntaCapturedActions[$TaskName]=$Action }
          & ./tools/install-synta-background-tasks.ps1
          $syntaCapturedAction = $syntaCapturedActions['Synta-Managed-Update']
          if ($syntaCapturedActions['Synta-Owned-CPU-Worker'].Execute -notmatch 'wscript.exe$') { throw 'CPU task was not wrapped.' }
          if ($syntaCapturedAction.Execute -notmatch 'wscript.exe$') { throw 'Task still creates a console.' }
          $wrapper = Join-Path $root 'tools/background-tasks/Synta-Managed-Update.vbs'
          $process = Start-Process -FilePath $syntaCapturedAction.Execute -ArgumentList @('//B','//Nologo',('"' + $wrapper + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 23) { throw 'Child exit status lost.' }
          if ((Get-Content -Raw $marker).Trim() -ne 'passed') { throw 'Child arguments lost.' }
          exit 0
