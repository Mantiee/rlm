name: V100 controller CPU validation
on:
  push:
    branches: [v100-rtx-reconnect]
    paths:
      - 'rlm/v100/**'
      - 'tests/test_v100*'
      - 'tools/*.ps1'
      - '.github/workflows/v100-cpu-validation.yml'
permissions:
  contents: read
concurrency:
  group: v100-cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies and CPU Torch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install . pytest==8.4.2 numpy==2.2.6 psutil==7.0.0 safetensors==0.5.3 tomli-w==1.2.0 transformers==5.17.0 peft==0.21.2 accelerate==1.15.0
      - name: Exercise controller, DPO gradients, tensor breeding and tiny model training
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: python -m pytest -q tests/test_v100*.py
  powershell-parser:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows scripts without executing helper or installers
        shell: powershell
        run: |
          $failures = 0
          Get-ChildItem -Path tools -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($problem in $errors) {
              Write-Output ($_.Name + ': ' + $problem.Message)
              $failures += 1
            }
          }
          if ($failures -gt 0) { throw 'PowerShell syntax errors detected.' }
